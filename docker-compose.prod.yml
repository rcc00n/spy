services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spy}
      POSTGRES_USER: ${POSTGRES_USER:-spy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spy} -d ${POSTGRES_DB:-spy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WAIT_FOR_POSTGRES: "1"
      RUN_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - facebook_auth_state:/app/runtime
    ports:
      - "127.0.0.1:${SPY_WEB_PORT:-18010}:8000"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3

  celery-worker:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WAIT_FOR_POSTGRES: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - facebook_auth_state:/app/runtime
    command: celery -A config worker --loglevel=info

